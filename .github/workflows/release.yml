name: Release

# Publishes a Windows installer to GitHub Releases whenever a version tag is
# pushed. Clients auto-update from these releases via update.electronjs.org.
#
# Release flow:
#   1. Bump "version" in package.json (e.g. 1.0.1) and commit.
#   2. Tag it:  git tag v1.0.1  &&  git push origin v1.0.1
#   3. This workflow builds + uploads a DRAFT release.
#   4. Review the draft on GitHub, then publish it. Auto-update only sees
#      published (non-draft) releases.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Squirrel.Windows + native modules (better-sqlite3, sharp) must build on Windows.
    runs-on: windows-latest

    # Referencing secrets in a job-level env is allowed; step `if` then gates on
    # this instead of on the secrets context directly.
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      # Optional: decode a base64-encoded code-signing certificate into a file.
      # No-op until the WINDOWS_CERTIFICATE_BASE64 secret exists, so unsigned
      # builds keep working. See RELEASE.md for how to add a certificate.
      - name: Prepare code-signing certificate
        id: cert
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:CERT_B64)
          $path = Join-Path $env:RUNNER_TEMP 'code-sign.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          "path=$path" >> $env:GITHUB_OUTPUT
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty unless the secrets are configured; forge.config.ts only signs
          # when WINDOWS_CERTIFICATE_FILE is set.
          WINDOWS_CERTIFICATE_FILE: ${{ steps.cert.outputs.path }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run publish
